<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hangtime</title>
<meta name="description" content="Hangman with friends: a daily word for everyone, endless practice, pass and play, and live online games with a share link.">
<meta property="og:title" content="Hangtime">
<meta property="og:description" content="Play hangman with your friends online. Pick words for each other, race to solve, and save the stick figure.">
<meta name="theme-color" content="#ECEFF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D131A" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23131B25'/%3E%3Cpath d='M18 50h22M24 50V14h22v8' stroke='%23ECEFF3' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='46' cy='29' r='6' stroke='%23EDBB48' stroke-width='4' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  /* Layout: one Wordle-width play column; on wide screens the board gains a right rail for scores, reactions and the live feed */
  --bg:#ECEFF3; --surface:#FFFFFF; --sunk:#F4F6F8; --ink:#131B25; --muted:#5A6777; --line:#D0D8E0; --key:#DCE2E8;
  --hit:#1F7E5B; --hit-ink:#FFFFFF; --miss:#BF4A34; --turn:#B88310; --turn-soft:rgba(201,144,19,.15);
  --dot:rgba(19,27,37,.07); --scrim:rgba(10,14,20,.45);
  --shadow:0 1px 2px rgba(19,27,37,.06),0 10px 30px rgba(19,27,37,.07);
  --p1:#2F6FD0; --p2:#C2492F; --p3:#1F7E5B; --p4:#8A4FC8; --p5:#B88310; --p6:#16839A;
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --radius:14px; --radius-sm:9px; --amb:.20; --spring:cubic-bezier(.2,1.4,.4,1); --ease-out:cubic-bezier(.2,.8,.3,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D131A; --surface:#151E28; --sunk:#111922; --ink:#E6EBF0; --muted:#8B98A6; --line:#27323E; --key:#222D39;
    --hit:#34A57A; --hit-ink:#06140E; --miss:#E26A51; --turn:#EDBB48; --turn-soft:rgba(237,187,72,.14);
    --dot:rgba(230,235,240,.045); --scrim:rgba(0,0,0,.6); --amb:.13;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35);
    --p1:#6EA2F0; --p2:#EC7A5F; --p3:#46B98C; --p4:#B48BE8; --p5:#EDBB48; --p6:#4FB7CC;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D131A; --surface:#151E28; --sunk:#111922; --ink:#E6EBF0; --muted:#8B98A6; --line:#27323E; --key:#222D39;
  --hit:#34A57A; --hit-ink:#06140E; --miss:#E26A51; --turn:#EDBB48; --turn-soft:rgba(237,187,72,.14);
  --dot:rgba(230,235,240,.045); --scrim:rgba(0,0,0,.6); --amb:.13;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35);
  --p1:#6EA2F0; --p2:#EC7A5F; --p3:#46B98C; --p4:#B48BE8; --p5:#EDBB48; --p6:#4FB7CC;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);
  background-size:22px 22px;
  color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--turn);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.muted{color:var(--muted)}
.small{font-size:13px}
.wrap{max-width:1040px;margin:0 auto;padding-block:10px 48px}

.invite{border-color:var(--turn);box-shadow:0 0 0 1px var(--turn),var(--shadow)}

/* top bar */
.top{display:flex;align-items:center;gap:4px;padding-block:6px 12px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.025em;background:none;border:0;padding:4px 6px 4px 2px;border-radius:10px}
.brand-mark{width:28px;height:30px;border-radius:7px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:17px;font-weight:800;line-height:1}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid transparent;background:transparent;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--surface);border-color:var(--line);color:var(--ink)}
.icon-btn svg{width:20px;height:20px}

/* shared controls */
.btn{min-height:44px;padding:0 18px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:transform .08s,background .15s,border-color .15s}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.accent{background:var(--hit);color:var(--hit-ink);border-color:var(--hit)}
.btn.big{min-height:52px;font-size:16px;padding:0 26px}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--ink);background:var(--surface);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.field{min-height:44px;border:1px solid var(--line);border-radius:11px;background:var(--sunk);padding:0 14px;min-width:0;width:100%}
.field:focus{border-color:var(--ink);outline:none;background:var(--surface)}
.field.code{text-transform:uppercase;letter-spacing:.32em;font-weight:700;font-family:var(--font-display);text-align:center;font-size:18px;max-width:9.5em}
.field.big{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
label.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > .field{flex:1 1 160px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);min-width:0}
.panel h2{font-family:var(--font-display);font-size:22px;letter-spacing:-.02em;margin:0 0 6px;display:flex;align-items:center;gap:10px}
.count{font-size:13px;font-family:var(--font-body);font-weight:700;background:var(--sunk);border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--muted)}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap;max-width:100%}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1),0 0 0 1px var(--line)}
.seg button:disabled{cursor:default}
.settings{display:grid;gap:14px;margin-top:12px}
.setting{display:grid;gap:6px}
.code-chip{font-family:var(--font-display);font-weight:800;letter-spacing:.16em;font-size:13px;padding:3px 9px;border-radius:7px;background:var(--ink);color:var(--bg)}
.err{color:var(--miss);font-weight:600;font-size:14px;min-height:1px;margin:6px 0 0}
.err:empty{display:none}

/* home */
.home{max-width:900px;margin:0 auto;display:grid;gap:30px}
.hero{display:grid;gap:16px;justify-items:start;padding-top:6px}
.logo{display:flex;gap:6px;margin:0;flex-wrap:wrap}
.logo .t{--size:clamp(34px,9.4vw,58px)}
.logo .t.blank::after{content:"";position:absolute;left:22%;right:22%;bottom:16%;height:3px;border-radius:2px;background:var(--turn);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.lede{color:var(--muted);font-size:17px;max-width:54ch;margin:0}
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:920px){.modes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.modes{grid-template-columns:1fr}}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 18px;display:grid;gap:4px;align-content:start;transition:transform .15s,border-color .15s,box-shadow .15s;min-width:0}
.mode:hover{transform:translateY(-2px);border-color:var(--ink);box-shadow:var(--shadow)}
.mode b{font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:-.015em;line-height:1.2;margin-top:4px}
.mode .desc{color:var(--muted);font-size:14px}
.mode .state{margin-top:8px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.pip{width:8px;height:8px;border-radius:50%;background:var(--turn);display:inline-block}
.pip.done{background:var(--hit)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13.5px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.online{display:grid;gap:16px}
.online-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:end}
@media (max-width:620px){.online-grid{grid-template-columns:1fr}}
.joinform{display:flex;gap:8px}
.games{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.games li{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:var(--sunk);flex-wrap:wrap}
.games li .g-info{flex:1 1 140px;min-width:0;font-size:14px;color:var(--muted)}
.games li .g-info b{color:var(--ink)}
.note{border-left:3px solid var(--turn);padding:10px 14px;background:var(--turn-soft);border-radius:0 10px 10px 0;font-size:14px}

/* board */
.board{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;max-width:620px;margin:0 auto}
.board.has-rail{max-width:1000px}
@media (min-width:920px){.board.has-rail{grid-template-columns:minmax(0,1fr) 300px;align-items:start}}
.play{display:grid;gap:14px;justify-items:center;min-width:0}
.roundline{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}
.stage{display:flex;align-items:flex-end;justify-content:center;gap:16px}
.figure{width:min(190px,44vw);aspect-ratio:200/222}
.figure svg{width:100%;height:100%;overflow:visible;display:block}
.gallows{stroke:var(--line);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.rope{stroke:var(--muted);stroke-width:3;stroke-linecap:round;fill:none;opacity:.7}
.part{stroke:var(--ink);stroke-width:5;stroke-linecap:round;fill:none}
.part.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .5s cubic-bezier(.4,0,.2,1) forwards}
.face{stroke-width:2.6;stroke-linecap:round;fill:none}
@keyframes draw{to{stroke-dashoffset:0}}
.figure.lost .part,.figure.lost .face{stroke:var(--miss)}
.figure.won .part,.figure.won .face{stroke:var(--hit)}
.figure.won .body-g{animation:hop .7s ease-in-out 3;transform-origin:140px 180px}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-12px)}}
.lives{display:flex;gap:6px;align-items:center;justify-content:center}
.life{width:10px;height:10px;border-radius:50%;background:var(--ink);transition:background .3s,box-shadow .3s}
.life.gone{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.lives-n{font-size:13px;color:var(--muted);font-weight:600;margin-left:6px;font-variant-numeric:tabular-nums}
.clue{font-size:14.5px;color:var(--muted);text-align:center;max-width:46ch}
.clue b{color:var(--ink);font-weight:600}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 20px;width:100%;perspective:600px}
.wordg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.t{--size:max(22px,min(48px,calc((min(100vw,660px) - 44px) / (var(--n,6) + 1.4) - 5px)));position:relative;width:var(--size);height:calc(var(--size) * 1.16);border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:calc(var(--size) * .56);line-height:1;text-transform:uppercase;user-select:none}
.t.on{border-color:var(--ink)}
.t.pop{animation:flip .45s cubic-bezier(.3,.7,.4,1)}
@keyframes flip{0%{transform:rotateX(-90deg)}100%{transform:rotateX(0)}}
.t.punct{border-color:transparent;background:transparent;width:calc(var(--size) * .5)}
.t.missed{color:var(--miss);border-color:var(--miss);border-style:dashed}
.t.mine{color:var(--muted);opacity:.75}
.shake{animation:shake .42s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.status{min-height:26px;font-weight:600;text-align:center;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.status .av{width:24px;height:24px;font-size:11px}
.tried{font-size:13.5px;color:var(--muted);text-align:center}
.tried s{color:var(--miss);margin:0 3px;text-decoration-thickness:2px}
.kb{display:grid;gap:7px;width:100%;max-width:520px;user-select:none;margin-top:4px}
.kb-row{display:flex;gap:6px;justify-content:center}
.key{flex:1 1 0;max-width:48px;min-width:0;height:56px;border-radius:8px;border:0;background:var(--key);font-weight:700;font-size:17px;padding:0;transition:transform .08s,background .2s,color .2s}
.key:active,.key.pressed{transform:scale(.92)}
.key.hit{background:var(--hit);color:var(--hit-ink)}
.key.miss{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);text-decoration:line-through;text-decoration-color:var(--miss)}
.key:disabled{cursor:default}
.kb.locked .key:not(.hit):not(.miss){opacity:.5}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.solve{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:520px}
.solve .field{flex:1 1 200px;font-family:var(--font-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.hintline{font-size:12.5px;color:var(--muted);text-align:center;width:100%}

/* rail */
.rail{display:grid;gap:12px;align-content:start;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.players{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.pl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 8px;border-radius:10px;transition:background .25s}
.pl.turn{background:var(--turn-soft)}
.pl.turn .av{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--turn)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;position:relative;flex:none;text-transform:uppercase}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av .dot{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;background:var(--hit);border:2px solid var(--surface)}
.pl.off .av{opacity:.45}
.pl .who{min-width:0}
.pl .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .tag{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.you{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:4px}
.pl .sc{font-family:var(--font-display);font-weight:800;font-variant-numeric:tabular-nums;font-size:19px}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:13.5px;color:var(--muted)}
.feed b{color:var(--ink);font-weight:600}
.feed li{overflow-wrap:anywhere}
.reacts{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.react{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);font-size:20px;line-height:1;transition:transform .1s}
.react:active{transform:scale(.88)}
.floaty{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));font-size:34px;pointer-events:none;animation:floatup 2.3s ease-out forwards;z-index:30}
@keyframes floatup{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:1;transform:translateY(-40px) scale(1.15)}100%{transform:translateY(-55vh) scale(1);opacity:0}}

/* result + final */
.result{width:100%;max-width:520px;text-align:center;display:grid;gap:12px;justify-items:center;padding:22px 20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);animation:rise .35s ease}
@keyframes rise{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.result h2{font-family:var(--font-display);font-size:30px;margin:0;letter-spacing:-.025em;line-height:1.1}
.result p{margin:0}
.deltas{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.delta{padding:4px 11px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.delta b{color:var(--hit)}
.mini-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%;max-width:360px}
.mini-stats div{display:grid;justify-items:center}
.mini-stats b{font-family:var(--font-display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.mini-stats span{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.2}
.final{max-width:620px;margin:0 auto;display:grid;gap:18px;justify-items:center;text-align:center}
.final h1{font-family:var(--font-display);font-size:clamp(32px,7vw,48px);letter-spacing:-.03em;margin:0;line-height:1.05}
.standings{list-style:none;margin:0;padding:0;display:grid;gap:8px;width:100%}
.standings li{display:grid;grid-template-columns:28px auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:left}
.standings li.first{border-color:var(--turn);box-shadow:0 0 0 1px var(--turn)}
.rank{font-family:var(--font-display);font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.standings .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.standings .sc{font-family:var(--font-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.history{list-style:none;margin:0;padding:0;display:grid;gap:4px;width:100%;font-size:14px;color:var(--muted);text-align:left}
.history b{color:var(--ink)}

/* lobby / setup / set word */
.lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;max-width:900px;margin:0 auto}
@media (max-width:760px){.lobby{grid-template-columns:1fr}}
.lobby .span{grid-column:1 / -1}
.code-tiles{display:flex;gap:8px;margin:10px 0 12px}
.code-tiles .t{--size:clamp(44px,12vw,58px)}
.start-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.setup{max-width:560px;margin:0 auto;display:grid;gap:16px}
.names{display:grid;gap:8px}
.names .row{flex-wrap:nowrap}
.names .av{width:30px;height:30px}
.setword{max-width:520px;margin:0 auto;width:100%;display:grid;gap:14px;text-align:left}
.setword.center{text-align:center;justify-items:center}
.setword h2{font-family:var(--font-display);font-size:28px;letter-spacing:-.02em;margin:0;line-height:1.15}
.setform{display:grid;gap:12px}
.waiting{display:grid;gap:8px;justify-items:center;text-align:center}
.waiting h2{font-family:var(--font-display);font-size:24px;margin:0;letter-spacing:-.02em}
.dots::after{content:"";animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* teams + chat */
.t-a{--team:var(--p2)}
.t-b{--team:var(--p1)}
.team-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--team,var(--muted));margin-right:6px;vertical-align:1px}
.teamscores{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.ts{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--team);border-radius:var(--radius);padding:10px 14px;display:grid;gap:2px;text-align:left}
.ts .eyebrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.06em}
.ts b{font-family:var(--font-display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.final .teamscores{max-width:420px}
.teamcols{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:start}
.lobby-vs{align-self:center;font-size:18px !important;width:auto !important;height:auto !important;background:none !important;box-shadow:none !important;color:var(--muted) !important}
.teamcol{border:1px solid var(--line);border-top:3px solid var(--team);border-radius:11px;padding:8px;display:grid;gap:4px;align-content:start;min-width:0}
.teamcol-h{font-weight:700;display:flex;align-items:center;gap:4px;padding:2px 4px}
.team-chip{flex:none;border:0;border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px;background:var(--team);color:#fff}
.delta .team-dot{margin-right:4px}
.chat .card-h{flex-wrap:wrap}
.chat.t-a,.chat.t-b{border-top:3px solid var(--team)}
.msgs{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px;max-height:220px;overflow-y:auto;font-size:14px;overscroll-behavior:contain}
.msgs li{display:grid;gap:1px;background:var(--sunk);border-radius:10px;padding:6px 10px;overflow-wrap:anywhere;justify-self:start;max-width:92%}
.msgs li.me{justify-self:end;background:var(--turn-soft)}
.msgs li b{font-size:12px;color:var(--muted);font-weight:700}
.msgs li.muted{background:transparent;padding:0}
.chatform{display:flex;gap:8px}
.chatform .field{flex:1 1 auto}

/* avatars */
.av-e{background:color-mix(in srgb,var(--avc) 24%,var(--surface));box-shadow:inset 0 0 0 2px var(--avc);color:var(--ink);font-size:18px;line-height:1}
.av-e.lg{width:52px;height:52px;font-size:30px}
.av-btn{border:0;cursor:pointer;width:40px;height:40px;font-size:22px;flex:none;transition:transform .12s}
.av-btn:hover{transform:scale(1.08)}
.av-more{background:var(--sunk);color:var(--muted);font-size:12px;box-shadow:inset 0 0 0 1.5px var(--line)}
.status .av-e{font-size:14px}
.avpick{display:flex;flex-wrap:wrap;gap:6px}
.avopt{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);font-size:22px;line-height:1;display:grid;place-items:center;transition:transform .1s,border-color .15s,background .15s}
.avopt:hover{transform:translateY(-2px)}
.avopt[aria-checked="true"]{border-color:var(--ink);background:var(--surface);box-shadow:0 0 0 2px var(--ink)}

/* red vs blue */
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch;gap:0;width:100%;max-width:620px;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--surface)}
.vs-side{padding:12px 14px;display:grid;gap:8px;min-width:0;background:linear-gradient(135deg,color-mix(in srgb,var(--team) 20%,var(--surface)),var(--surface) 75%);transition:opacity .3s}
.vs-side.t-b{background:linear-gradient(225deg,color-mix(in srgb,var(--team) 20%,var(--surface)),var(--surface) 75%);text-align:right}
.vs-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.vs-side.t-b .vs-head{justify-content:flex-end}
.vs-name{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--team)}
.vs-role{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.vs-side.giving .vs-role{color:var(--team)}
.vs-body{display:flex;align-items:center;justify-content:space-between;gap:10px}
.vs-side.t-b .vs-body{flex-direction:row-reverse}
.vs-avs{display:flex;min-width:0}
.vs-avs .av{width:34px;height:34px;font-size:19px;margin-right:-8px;border:2px solid var(--surface);box-sizing:content-box}
.vs-side.t-b .vs-avs{flex-direction:row-reverse}
.vs-side.t-b .vs-avs .av{margin-right:0;margin-left:-8px}
.vs-score{font-family:var(--font-display);font-weight:800;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.vs-mid{display:grid;place-items:center;padding:0 10px;font-family:var(--font-display);font-weight:800;font-size:15px;letter-spacing:.06em;color:var(--bg);background:var(--ink)}
.vs.compact .vs-score{font-size:28px}
.mode-vs{background:linear-gradient(135deg,color-mix(in srgb,var(--p2) 14%,var(--surface)),var(--surface) 45%,var(--surface) 55%,color-mix(in srgb,var(--p1) 14%,var(--surface)))}
.vs-word.t-a{color:var(--p2)} .vs-word.t-b{color:var(--p1)}
.btn-vs{background:linear-gradient(90deg,color-mix(in srgb,var(--p2) 22%,var(--surface)),color-mix(in srgb,var(--p1) 22%,var(--surface)))}

/* category */
.clue{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center}
.cat-chip{display:inline-flex;align-items:baseline;gap:8px;padding:6px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.cat-chip b{font-family:var(--font-display);font-size:17px;color:var(--ink);letter-spacing:-.01em}
.clue-from{font-size:13px;color:var(--muted)}
.clue-hint{flex-basis:100%;text-align:center}
.req{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--turn);margin-left:6px}
.catchips{margin-top:8px}
.catchips .chip{padding:4px 10px;font-size:13px}

/* ambient colour */
.ambient{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.ambient i{position:absolute;width:44vmax;height:44vmax;border-radius:50%;filter:blur(80px);opacity:var(--amb);animation:drift 26s ease-in-out infinite alternate}
.ambient i:nth-child(1){background:var(--p2);top:-20vmax;left:-14vmax}
.ambient i:nth-child(2){background:var(--p1);bottom:-22vmax;right:-16vmax;animation-delay:-9s}
.ambient i:nth-child(3){background:var(--p5);top:30%;left:45%;width:26vmax;height:26vmax;opacity:calc(var(--amb) * .6);animation-delay:-17s}
@keyframes drift{to{transform:translate(7vmax,5vmax) scale(1.12)}}

/* 3D avatars */
.av3d{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--avc) 14%,var(--surface)),color-mix(in srgb,var(--avc) 30%,var(--surface)));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--avc) 75%,transparent),0 2px 6px rgba(0,0,0,.12);overflow:visible}
.av3d img{width:112%;height:112%;margin:-6%;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2));pointer-events:none;user-select:none;-webkit-user-drag:none;transform-origin:50% 80%}
.av3d.sm{width:26px;height:26px}
.av3d.lg{width:56px;height:56px}
.av3d.xl{width:84px;height:84px}
.av3d.bob img{animation:bob 2.4s ease-in-out infinite;animation-delay:var(--bob,0s)}
.av3d.celebrate img{animation:celebrate .9s var(--spring) both,bob 2.4s .9s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px) rotate(-4deg)}}
@keyframes celebrate{0%{transform:scale(.2) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
.av-btn{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--avc) 14%,var(--surface)),color-mix(in srgb,var(--avc) 30%,var(--surface)))}
.av-btn img{width:112%;height:112%;margin:-6%}
.avopt{width:48px;height:48px;padding:0;overflow:visible}
.avopt img{width:38px;height:38px;transition:transform .25s var(--spring);pointer-events:none}
.avopt:hover img{transform:translateY(-3px) rotate(-8deg) scale(1.12)}
.avopt[aria-checked="true"] img{animation:celebrate .5s var(--spring)}
.pl.pop{animation:popin .6s var(--spring)}
@keyframes popin{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.result-av{display:flex;justify-content:center;gap:4px;margin-top:-50px}
.result-av .av3d{border:4px solid var(--surface);box-sizing:content-box}

/* home */
.hero{position:relative}
.floaters{position:absolute;top:-4px;right:0;width:min(34%,320px);height:150px;pointer-events:none}
.hero{min-height:150px}
.fl{position:absolute;width:58px;height:58px;filter:drop-shadow(0 12px 14px rgba(0,0,0,.2));animation:float 6s ease-in-out infinite,flin .8s var(--spring) both}
.f0{top:0;right:2%;width:84px;height:84px}
.f1{top:78px;right:36%;width:54px;height:54px;animation-delay:-1.2s,.1s}
.f2{top:84px;right:4%;width:58px;height:58px;animation-delay:-2.4s,.2s}
.f3{top:4px;right:64%;width:48px;height:48px;animation-delay:-3.1s,.3s}
.f4{top:72px;right:72%;width:44px;height:44px;animation-delay:-4.2s,.4s}
.f5{top:14px;right:32%;width:58px;height:58px;animation-delay:-5s,.5s}
@keyframes float{50%{transform:translateY(-12px) rotate(5deg)}}
@keyframes flin{from{opacity:0;transform:scale(.3) translateY(20px)}}
@media (max-width:760px){.floaters{position:relative;top:auto;right:auto;width:100%;height:84px;order:-1;margin-bottom:-6px}.fl{width:52px!important;height:52px!important;top:10px!important}.f0{right:4%}.f1{right:26%}.f2{right:48%}.f5{right:70%}.f3,.f4{display:none}}
.logo .t{animation:tilein .6s var(--spring) both;animation-delay:calc(var(--i,0) * 60ms)}
@keyframes tilein{from{transform:translateY(-18px) rotateX(70deg);opacity:0}}
.mode{position:relative;overflow:hidden}
.mode .eyebrow{padding-right:58px}
.mode-art{position:absolute;right:-6px;top:-6px;width:70px;height:70px;transform:rotate(12deg);transition:transform .45s var(--spring);filter:drop-shadow(0 8px 10px rgba(0,0,0,.18));pointer-events:none}
.mode-art.art-b{right:40px;top:4px;width:52px;height:52px;transform:rotate(-14deg)}
.mode:hover .mode-art{transform:rotate(-6deg) scale(1.14) translateY(6px)}
.mode:hover .mode-art.art-b{transform:rotate(8deg) scale(1.1) translate(-4px,6px)}
.mode:active{transform:translateY(0) scale(.99)}
.btn.primary{position:relative;overflow:hidden}
.btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.25) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s}
.btn.primary:hover::after{transform:translateX(120%)}

/* screen transitions */
#view.enter :is(.home,.lobby,.setup,.final,.play,.rail,.setword,.board) > *{animation:rise .55s var(--ease-out) both}
#view.enter :is(.home,.lobby,.setup,.final,.play,.rail,.setword,.board) > *:nth-child(2){animation-delay:.05s}
#view.enter :is(.home,.lobby,.setup,.final,.play,.rail,.setword,.board) > *:nth-child(3){animation-delay:.1s}
#view.enter :is(.home,.lobby,.setup,.final,.play,.rail,.setword,.board) > *:nth-child(4){animation-delay:.15s}
#view.enter :is(.home,.lobby,.setup,.final,.play,.rail,.setword,.board) > *:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}

/* game moments */
.vs-side.bump .vs-score{animation:bump .7s var(--spring)}
.vs-side.bump{animation:glow 1s ease}
@keyframes bump{35%{transform:scale(1.3)}}
@keyframes glow{30%{box-shadow:inset 0 0 0 999px color-mix(in srgb,var(--team) 14%,transparent)}}
.vs-side.giving .vs-avs .av3d img{animation:bob 2.4s ease-in-out infinite;animation-delay:var(--bob,0s)}
.vs-mid{animation:none}
#view.enter .vs-mid{animation:vsin .7s var(--spring) .15s both}
@keyframes vsin{from{transform:scale(2.2);opacity:0}}
.key{transition:transform .08s,background .25s,color .25s,box-shadow .25s}
.key:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.12)}
.key.just.hit{animation:keyhit .55s var(--spring)}
.key.just.miss{animation:keymiss .45s}
@keyframes keyhit{0%{transform:scale(.7)}55%{transform:scale(1.18);box-shadow:0 0 0 7px color-mix(in srgb,var(--hit) 30%,transparent)}100%{transform:none}}
@keyframes keymiss{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.figure.hurt{animation:hurt .5s}
@keyframes hurt{20%{transform:rotate(-4deg)}45%{transform:rotate(3.5deg)}70%{transform:rotate(-2deg)}}
.tiles.win .t{animation:wave .7s var(--spring) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes wave{40%{transform:translateY(-12px) scale(1.06);background:color-mix(in srgb,var(--hit) 18%,var(--surface))}}
.life{transition:background .35s,box-shadow .35s,transform .35s}
.life.gone{transform:scale(.8)}
.cat-chip{animation:none}
#view.enter .cat-chip{animation:popin .6s var(--spring) .2s both}

/* spotlight */
.spot{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:60;display:flex;align-items:center;gap:16px;padding:16px 26px 16px 16px;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.35);animation:spotin .55s var(--spring) forwards;pointer-events:none;max-width:calc(100vw - 32px)}
.spot.out{animation:spotout .45s ease forwards}
.spot-av img{width:76px;height:76px;display:block;animation:celebrate .8s var(--spring) both;filter:drop-shadow(0 8px 10px rgba(0,0,0,.2))}
.spot b{display:block;font-family:var(--font-display);font-size:28px;letter-spacing:-.025em;line-height:1.1}
.spot span{color:var(--muted);font-size:14.5px}
@keyframes spotin{to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes spotout{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(-50%,-62%) scale(.92);opacity:0}}

/* chat */
.msgs li{grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start}
.msgs li > div{display:grid;gap:1px;min-width:0}
.msgs li.me{grid-template-columns:minmax(0,1fr) auto}
.msgs li.me .av{order:2}
.msgs li.new{animation:msgin .4s var(--ease-out)}
@keyframes msgin{from{opacity:0;transform:translateY(8px) scale(.97)}}

/* podium */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;width:100%;max-width:460px;margin-top:8px}
.pod{display:grid;justify-items:center;gap:4px;flex:1 1 0;min-width:0;position:relative}
.pod b{font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod > span{font-family:var(--font-display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.pod .av3d img{animation:celebrate .9s var(--spring) both}
.pod.p1 .av3d img{animation-delay:.6s}
.pod.p2 .av3d img{animation-delay:.35s}
.pod.p3 .av3d img{animation-delay:.15s}
.pod-block{width:100%;border-radius:12px 12px 0 0;background:linear-gradient(var(--surface),var(--sunk));border:1px solid var(--line);border-bottom:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:28px;color:var(--muted);animation:grow .8s var(--ease-out) both;transform-origin:bottom}
.pod.p1 .pod-block{height:112px;color:var(--turn);border-color:color-mix(in srgb,var(--turn) 60%,var(--line))}
.pod.p2 .pod-block{height:80px;animation-delay:.12s}
.pod.p3 .pod-block{height:58px;animation-delay:.24s}
.crown{width:46px;height:46px;margin-bottom:-18px;position:relative;z-index:2;animation:crown 1s 1.1s var(--spring) both;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes crown{from{transform:translateY(-60px) rotate(-35deg);opacity:0}}

/* modal, toast */
.scrim{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:20px;z-index:40;animation:fade .15s ease}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);color:var(--ink);border-radius:18px;border:1px solid var(--line);width:min(460px,100%);max-height:86vh;overflow:auto;padding:22px;box-shadow:var(--shadow);position:relative}
.modal h2{font-family:var(--font-display);font-size:24px;margin:0 0 12px;letter-spacing:-.02em}
.modal .x{position:absolute;top:12px;right:12px}
.modal ul{padding-left:18px;margin:0;display:grid;gap:8px}
.modal textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);padding:10px;resize:vertical}
.dist{display:grid;gap:5px;margin-top:8px}
.dist-row{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;align-items:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.dist-bar{background:var(--key);color:var(--ink);border-radius:5px;padding:2px 8px;text-align:right;min-width:26px;justify-self:start}
.dist-bar.hl{background:var(--hit);color:var(--hit-ink)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:11px;font-weight:600;z-index:50;box-shadow:var(--shadow);max-width:calc(100vw - 32px);text-align:center}
.toast.show{animation:toastin .22s ease}
@keyframes toastin{from{transform:translate(-50%,-8px);opacity:0}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:45}
.loading{text-align:center;color:var(--muted);padding:60px 0}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important}
}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="wrap">
  <header id="top" class="top"></header>
  <main id="view"><noscript><p class="loading">Hangtime needs JavaScript to run.</p></noscript></main>
</div>
<div id="modal-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<script type="module" src="/app.js"></script>
</body>
</html>
